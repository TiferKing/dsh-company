name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verify gate (typecheck · test · build · package)
        run: pnpm verify

      - name: Pack the already-verified release
        run: npm pack --ignore-scripts

      - name: Write SHA256 checksum
        run: sha256sum dsh-company-*.tgz > SHA256SUMS

      - name: Check tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Create GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-company-*.tgz
            SHA256SUMS
