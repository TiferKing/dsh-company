name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · test · build · package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verify gate
        run: pnpm verify

      - name: Pack the already-verified build
        run: npm pack --ignore-scripts

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-company-${{ github.sha }}
          path: dsh-company-*.tgz
          retention-days: 14
          if-no-files-found: error
