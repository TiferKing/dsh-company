version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps): '

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps: '
    # Peer deps are rc-tagged DSH packages; keep updates manual and deliberate.
    open-pull-requests-limit: 5
