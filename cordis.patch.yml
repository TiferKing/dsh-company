- insert:
    - id: dsh-company
      name: dsh-company
      config:
        subagentProvider: spawn
        memberMaxDepth: 1
        maxEmployees: unlimited
        executionMode: adaptive
        maxConcurrentEmployees: 8
        executionMemoryHighWatermark: 0.8
        executionLagHighWatermarkMs: 200
        executionMaxPendingWrites: 32
        executionRetryMs: 1000
        maxProducts: 8
        maxWorkItems: 128
        maxOpenWorkItems: 32
        maxAttemptsPerWork: 5
        defaultCurrency: CNY
        maxMoneyBudgetMicros: 1000000000000000
        modelPrices: []
        maxTemporaryAuthorizationMs: 86400000
